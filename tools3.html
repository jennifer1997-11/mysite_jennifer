                    </button>
                </div>

                <!-- Region Filter Tabs -->

        // Initialize App on DOM Ready
        window.addEventListener('DOMContentLoaded', () => {
            initLeafletMap();
            renderRegionTabs();
            renderFilterOptions();
            filterAndRenderSpots();
            updateFavCountBadge();

            // Handle window resize for map & responsiveness
            window.addEventListener('resize', () => {
                if (map) {
                    map.invalidateSize();
                }
            });
        });

        // Leaflet Map Initialization
        function initLeafletMap() {
            // Default center: Taiwan center
            map = L.map('map', {
                center: [23.8, 120.9605],
                zoom: 8,
                zoomControl: false,
                dragging: true,
                touchZoom: true,
                scrollWheelZoom: true,
                doubleClickZoom: true,
                boxZoom: true,
                tap: true
            });

            // Re-add zoom control to bottom right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Street tile layer
            const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            });

            // Satellite tile layer
            const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 18,
                attribution: 'Tiles &copy; Esri'
            });

            activeTileLayer = streetLayer;
            activeTileLayer.addTo(map);

            // Ensure map redraws layout cleanly
            setTimeout(() => {
                map.invalidateSize();
            }, 200);
        }

        // Toggle Tile Layer
        function toggleTileLayer() {
            if (!map) return;
            map.removeLayer(activeTileLayer);
            isSatellite = !isSatellite;
            if (isSatellite) {
                activeTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 });
                document.getElementById('tile-toggle-btn').classList.add('bg-cyan-600', 'text-white');
            } else {
                activeTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
                document.getElementById('tile-toggle-btn').classList.remove('bg-cyan-600', 'text-white');
            }
            activeTileLayer.addTo(map);
        }

        // Recenter Map to Taiwan
        function recenterMap() {
            if (!map) return;
            map.flyTo([23.8, 120.9605], 8, { duration: 1 });
        }

        // Render Region Tabs
        function renderRegionTabs() {
            const regions = [
                { id: 'ALL', label: '全台灣' },
                { id: '北部', label: '北部' },
                { id: '東部', label: '東部' },
                { id: '南部', label: '南部' },
                { id: '西部/離島', label: '西部/離島' }
            ];

            const container = document.getElementById('region-tabs');
            container.innerHTML = regions.map(r => `
                <button onclick="setRegion('${r.id}')" class="px-3 py-1 rounded-lg text-xs font-medium whitespace-nowrap transition ${currentRegion === r.id ? 'bg-cyan-500 text-slate-950 font-bold shadow-md shadow-cyan-500/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                    ${r.label}
                </button>
            `).join('');
        }

        function setRegion(reg) {
            currentRegion = reg;
            renderRegionTabs();
            filterAndRenderSpots();
        }

        // Render Filter Badges (Level & Seabed)
        function renderFilterOptions() {
            const levels = ['ALL', '初學者', '中階', '高階'];
            const seabeds = ['ALL', '沙灘', '礁岩', '鵝卵石'];

            document.getElementById('level-filters').innerHTML = levels.map(lvl => `
                <button onclick="setLevel('${lvl}')" class="px-2.5 py-0.5 rounded-md text-[11px] transition ${currentLevel === lvl ? 'bg-cyan-600 text-white font-bold' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}">
                    ${lvl === 'ALL' ? '全部難度' : lvl}
                </button>
            `).join('');

            document.getElementById('seabed-filters').innerHTML = seabeds.map(sb => `
                <button onclick="setSeabed('${sb}')" class="px-2.5 py-0.5 rounded-md text-[11px] transition ${currentSeabed === sb ? 'bg-cyan-600 text-white font-bold' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}">
                    ${sb === 'ALL' ? '全部材質' : sb}
                </button>
            `).join('');
        }

        function setLevel(lvl) {
            currentLevel = lvl;
            renderFilterOptions();
            filterAndRenderSpots();
        }

        function setSeabed(sb) {
            currentSeabed = sb;
            renderFilterOptions();
            filterAndRenderSpots();
        }

        function handleSearch(val) {
            searchQuery = val.trim().toLowerCase();
            document.getElementById('search-clear-btn').classList.toggle('hidden', searchQuery === '');
            filterAndRenderSpots();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            handleSearch('');
        }

        function toggleFavoritesOnly() {
            showFavoritesOnly = !showFavoritesOnly;
            const btn = document.getElementById('fav-filter-btn');
            btn.classList.toggle('bg-rose-500/20', showFavoritesOnly);
            btn.classList.toggle('border-rose-500/40', showFavoritesOnly);
            btn.classList.toggle('text-rose-300', showFavoritesOnly);
            filterAndRenderSpots();
        }

        function toggleMobileFilter() {
            isMobileFilterExpanded = !isMobileFilterExpanded;
            const panel = document.getElementById('advanced-filter-panel');
            const chevron = document.getElementById('filter-chevron');
            panel.classList.toggle('hidden', !isMobileFilterExpanded);
            chevron.style.transform = isMobileFilterExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        // Filter & Render Logic
        function filterAndRenderSpots() {
            const filtered = SPOTS_DATA.filter(spot => {
                if (currentRegion !== 'ALL' && spot.region !== currentRegion) return false;
                if (currentLevel !== 'ALL' && spot.level !== currentLevel) return false;
                if (currentSeabed !== 'ALL' && !spot.seabed.includes(currentSeabed)) return false;
                if (showFavoritesOnly && !favorites.includes(spot.id)) return false;
                if (searchQuery) {
                    const matchName = spot.name.toLowerCase().includes(searchQuery);
                    const matchCounty = spot.county.toLowerCase().includes(searchQuery);
                    if (!matchName && !matchCounty) return false;
                }
                return true;
            });

            document.getElementById('spots-count').textContent = `共 ${filtered.length} 個浪點`;

            renderSpotCards(filtered);
            renderMapMarkers(filtered);
        }

        // Render Left Cards
        function renderSpotCards(spots) {
            const listEl = document.getElementById('spot-list');
            if (spots.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 text-slate-500 space-y-2">
                        <i class="fa-solid fa-water-lower text-3xl"></i>
                        <p class="text-xs">沒有找到符合條件的衝浪浪點</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = spots.map(spot => {
                const isFav = favorites.includes(spot.id);
                const levelColor = spot.level === '初學者' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' :
                                   spot.level === '中階' ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : 'bg-rose-500/10 text-rose-400 border-rose-500/30';

                return `
                    <div onclick="selectSpot('${spot.id}', true)" class="group bg-slate-900 hover:bg-slate-800/80 border ${selectedSpotId === spot.id ? 'border-cyan-500 bg-slate-800' : 'border-slate-800'} rounded-xl p-3 cursor-pointer transition duration-200 flex gap-3 shadow-md">
                        <div class="w-20 h-20 rounded-lg overflow-hidden shrink-0 bg-slate-950 relative">
                            <img src="${spot.image}" alt="${spot.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-300" onerror="this.src='https://placehold.co/200x200/0f172a/0ea5e9?text=SURF'">
                            <button onclick="event.stopPropagation(); toggleFavorite('${spot.id}')" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-slate-950/70 text-slate-400 hover:text-rose-400 flex items-center justify-center text-[10px] backdrop-blur-sm transition">
                                <i class="fa-solid fa-heart ${isFav ? 'text-rose-500' : ''}"></i>
                            </button>
                        </div>

                        <div class="flex-1 min-w-0 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between gap-1 mb-1">
                                    <h3 class="font-bold text-sm text-slate-100 group-hover:text-cyan-400 transition truncate">${spot.name}</h3>
                                    <span class="px-1.5 py-0.5 rounded border text-[10px] shrink-0 font-medium ${levelColor}">${spot.level}</span>
                                </div>
                                <div class="text-[11px] text-slate-400 flex items-center gap-1">
                                    <i class="fa-solid fa-location-dot text-cyan-400 text-[10px]"></i>
                                    <span class="truncate">${spot.county}</span>
                                    <span class="text-slate-600">•</span>
                                    <span>${spot.seabed}</span>
                                </div>
                            </div>

                            <div class="flex items-center justify-between pt-2 border-t border-slate-800/80 text-[10px] text-slate-400">
                                <span><i class="fa-solid fa-wind text-cyan-400 mr-1"></i>${spot.wind}</span>
                                <span class="text-cyan-400 group-hover:translate-x-0.5 transition font-medium">查看浪況 <i class="fa-solid fa-chevron-right text-[8px]"></i></span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render Map Markers
        function renderMapMarkers(spots) {
            if (!map) return;

            // Clear existing markers
            Object.values(activeMarkers).forEach(m => map.removeLayer(m));
            activeMarkers = {};

            spots.forEach(spot => {
                // Custom Leaflet DivIcon
                const iconHtml = `
                    <div class="relative group">
                        <div class="w-8 h-8 rounded-full bg-slate-900 border-2 border-cyan-400 shadow-xl flex items-center justify-center text-cyan-400 hover:scale-125 hover:bg-cyan-500 hover:text-slate-950 transition duration-200">
                            <i class="fa-solid fa-water text-xs"></i>
                        </div>
                    </div>
                `;

                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: 'custom-surf-marker',
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([spot.lat, spot.lng], { icon: customIcon }).addTo(map);

                // Leaflet Popup Content
                const popupContent = `
                    <div class="w-56 overflow-hidden rounded-xl bg-slate-900">
                        <img src="${spot.image}" class="w-full h-24 object-cover">
                        <div class="p-3">
                            <div class="font-bold text-sm text-white mb-0.5">${spot.name}</div>
                            <div class="text-[11px] text-slate-400 mb-2"><i class="fa-solid fa-location-dot text-cyan-400 mr-1"></i>${spot.county} (${spot.seabed})</div>
                            <button onclick="selectSpot('${spot.id}', false)" class="w-full py-1.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-lg transition text-center shadow">
                                查看完整浪況與介紹
                            </button>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent, { offset: [0, -10] });

                marker.on('click', () => {
                    selectSpot(spot.id, false);
                });

                activeMarkers[spot.id] = marker;
            });
        }

        // Select Spot (Trigger FlyTo & Drawer)
        function selectSpot(spotId, closePopup = true) {
            selectedSpotId = spotId;
            const spot = SPOTS_DATA.find(s => s.id === spotId);
            if (!spot) return;

            // Re-render cards to reflect active border
            filterAndRenderSpots();

            // FlyTo Spot coordinates (Level 13)
            if (map) {
                map.flyTo([spot.lat, spot.lng], 13, {
                    duration: 1.2,
                    easeLinearity: 0.25
                });

                if (activeMarkers[spotId]) {
                    if (closePopup) {
                        activeMarkers[spotId].closePopup();
                    }
                }
            }

            // Open Detail Modal / Drawer
            openModal(spot);
        }

        // Open Side Detail Modal
        function openModal(spot) {
            document.getElementById('modal-img').src = spot.image;
            document.getElementById('modal-title').textContent = spot.name;
            document.getElementById('modal-location').textContent = `${spot.county} (北緯 ${spot.lat.toFixed(3)}, 東經 ${spot.lng.toFixed(3)})`;
            document.getElementById('modal-description').textContent = spot.description;
            document.getElementById('modal-hazards').textContent = spot.hazards;

            // Badges
            document.getElementById('modal-region-badge').textContent = spot.region;
            
            const lvlBadge = document.getElementById('modal-level-badge');
            lvlBadge.textContent = spot.level;
            lvlBadge.className = spot.level === '初學者' ? 'px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold' :
                                 spot.level === '中階' ? 'px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[10px] font-bold' :
                                 'px-2 py-0.5 rounded-md bg-rose-500/20 text-rose-300 border border-rose-500/30 text-[10px] font-bold';

            document.getElementById('modal-seabed-badge').textContent = spot.seabed;

            // Live Metrics
            document.getElementById('modal-wave-height').textContent = spot.waveHeight;
            document.getElementById('modal-wave-period').textContent = spot.wavePeriod;
            document.getElementById('modal-wind').textContent = spot.wind;
            document.getElementById('modal-temp').textContent = spot.waterTemp;
            document.getElementById('modal-tides').textContent = spot.tides;
            document.getElementById('modal-best-time').textContent = `最佳下水時間: ${spot.bestTime}`;

            // Hourly Forecast
            document.getElementById('modal-hourly-forecast').innerHTML = spot.hourly.map(h => `
                <div class="bg-slate-900 p-2 rounded-lg border border-slate-800">
                    <div class="text-[9px] text-slate-400 mb-0.5">${h.time}</div>
                    <div class="text-xs font-bold text-slate-100">${h.wave}</div>
                    <div class="text-[9px] text-emerald-400 mt-0.5">${h.status}</div>
                </div>
            `).join('');

            // Amenities
            document.getElementById('modal-amenities').innerHTML = spot.amenities.map(a => `
                <span class="px-2.5 py-1 rounded-lg bg-slate-950 text-slate-300 border border-slate-800 text-xs flex items-center gap-1">
                    <i class="fa-solid fa-check text-cyan-400 text-[10px]"></i> ${a}
                </span>
            `).join('');

            // Favorite Button
            updateModalFavButton(spot.id);

            // Google Maps Navigation URL
            document.getElementById('modal-nav-btn').href = `https://www.google.com/maps/search/?api=1&query=${spot.lat},${spot.lng}`;

            // Show Drawer (Slide In, pure transparent background so map stays crisp)
            const modal = document.getElementById('spot-modal');
            const content = document.getElementById('spot-modal-content');

            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');
            content.classList.remove('translate-x-full');
        }

        // Close Modal
        function closeModal() {
            const modal = document.getElementById('spot-modal');
            const content = document.getElementById('spot-modal-content');

            content.classList.add('translate-x-full');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
        }

        // Favorite Toggle Logic
        function toggleFavorite(spotId) {
            if (favorites.includes(spotId)) {
                favorites = favorites.filter(id => id !== spotId);
            } else {
                favorites.push(spotId);
            }
            localStorage.setItem('taiwan_surf_favs', JSON.stringify(favorites));
            updateFavCountBadge();
            filterAndRenderSpots();
            if (selectedSpotId === spotId) {
                updateModalFavButton(spotId);
            }
        }

        function toggleModalFavorite() {
            if (selectedSpotId) {
                toggleFavorite(selectedSpotId);
            }
        }

        function updateModalFavButton(spotId) {
            const btn = document.getElementById('modal-fav-btn');
            const isFav = favorites.includes(spotId);
            btn.innerHTML = `<i class="fa-solid fa-heart text-sm ${isFav ? 'text-rose-500' : 'text-slate-400'}"></i>`;
        }

        function updateFavCountBadge() {
            document.getElementById('fav-count-badge').textContent = favorites.length;
        }

        // Mobile View Mode Switcher
        function switchMobileView(mode) {
            currentMobileView = mode;
            const sidebar = document.getElementById('sidebar-container');
            const mapContainer = document.getElementById('map-container');

            const btnSplit = document.getElementById('btn-view-split');
            const btnMap = document.getElementById('btn-view-map');
            const btnList = document.getElementById('btn-view-list');

            [btnSplit, btnMap, btnList].forEach(b => {
                b.className = 'px-2.5 py-1 rounded-md text-slate-400 hover:text-white transition-colors';
            });

            if (mode === 'split') {
                btnSplit.className = 'px-2.5 py-1 rounded-md transition-colors bg-cyan-600 text-white font-medium';
                sidebar.classList.remove('hidden');
                sidebar.classList.add('h-1/2');
                mapContainer.classList.remove('hidden');
                mapContainer.classList.add('h-1/2');
            } else if (mode === 'map') {
                btnMap.className = 'px-2.5 py-1 rounded-md transition-colors bg-cyan-600 text-white font-medium';
                sidebar.classList.add('hidden');
                mapContainer.classList.remove('hidden', 'h-1/2');
                mapContainer.classList.add('h-full');
            } else if (mode === 'list') {
                btnList.className = 'px-2.5 py-1 rounded-md transition-colors bg-cyan-600 text-white font-medium';
                sidebar.classList.remove('hidden', 'h-1/2');
                sidebar.classList.add('h-full');
                mapContainer.classList.add('hidden');
            }

            setTimeout(() => {
                if (map) map.invalidateSize();
            }, 100);
        }
    </script>
</body>
</html>
